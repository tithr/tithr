<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"><animate attributeName="stop-color" values="#07111f;#102b4d;#07111f" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#175487"><animate attributeName="stop-color" values="#175487;#429fde;#175487" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#58b6ff"><animate attributeName="stop-color" values="#58b6ff;#2174b5;#58b6ff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset=".38" stop-color="#d9f2ff" stop-opacity=".88"/>
      <stop offset=".62" stop-color="#82caff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#eff9ff" stop-opacity=".94"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glassShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.08 0 0 0 0 0.16 0 0 0 .5 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#g)"/>
  <circle cx="1000" cy="-30" r="170" fill="#d8f1ff" opacity=".45" filter="url(#blur)"><animate attributeName="cx" values="1000;920;1000" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="290" r="130" fill="#030a13" opacity=".45" filter="url(#blur)"><animate attributeName="cx" values="150;250;150" dur="9s" repeatCount="indefinite"/></circle>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-2" fill="url(#glass)" stroke="#f5fcff" stroke-opacity=".58" stroke-width=".8" paint-order="stroke fill" filter="url(#glassShadow)">tiago rosario</text>
  <text x="600" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="2" fill="#eff6ff">computação · design · ideias em movimento</text>
</svg>
